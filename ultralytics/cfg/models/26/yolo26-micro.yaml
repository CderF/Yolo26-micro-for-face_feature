# YOLO26-Micro Custom Architecture for Facial Expression Classification
# Goal:
#   First step: 抛弃 P5 (防止模型提取过深，导致丢失面部细微特征细节)
#   Second step: 引入 P2 (160x160) 超高分辨率（提升对面部的整体认识）
#   Third step: 在 P2 层后插入 C2PSA 注意力机制，在特征被继续下采样/池化前，先压制背景噪声、
#               放大五官区域响应，避免局部小特征（眉毛/嘴角等）的语义信息被稀释
#   Fourth step: 分类任务只需要"整张脸是什么表情"这一个全局判断，不需要定位局部动作单元的位置，
#               因此舍弃 Detect/FPN/PAN，只保留骨干 + 单一 Classify 头

# 基础参数配置
nc: 7               # 类别数 (RAF-DB 预训练阶段 7 类；线上课堂微调阶段替换为 4 类 Understand/Doubt/Neutral/Disgust)
scales:              # 模型缩放比例 [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # 官方 nano 缩放系数；C2PSA 已同步上游 num_heads=max(c//64, 1) 修复，无需再手动升级到 s

# Backbone (骨干网络) - 截断于 P4，深挖 P2
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0: P1/2 (320x320) - 初始下采样

  # === P2 超清层提取 ===
  - [-1, 1, Conv, [256, 3, 2]]  # 1: P2/4 (160x160)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2: 提取高频细节
  # 在特征还未被压缩前，用注意力锁定五官区域、压制背景噪声
  - [-1, 1, C2PSA, [256]]       # 3: C2PSA 注意力机制

  # === P3 主力层提取 ===
  - [-1, 1, Conv, [256, 3, 2]]  # 4: P3/8 (80x80)
  # 通道数比 P2 翻倍 (64->128 实际通道)：P2->P3 之间不能通道数原地踏步，
  # 否则 P2 抓到的细粒度线索没有足够的容量在这里被组合成更高阶的表情语义
  - [-1, 2, C3k2, [512, False, 0.25]] # 5: 融合中层语义

  # === P4 全局层提取（网络终点，不再下采样到 P5）===
  - [-1, 1, Conv, [512, 3, 2]]  # 6: P4/16 (40x40)
  - [-1, 2, C3k2, [512, True]]  # 7: 提取面部整体轮廓特征
  - [-1, 1, SPPF, [512, 5]]     # 8: 空间金字塔池化，扩大感受野后直接送入分类头

# Head (分类头) - 单一全局输出，不做多尺度检测
head:
  - [-1, 1, Classify, [nc]]     # 9: 全局平均池化 + 全连接，输出整张脸的表情类别概率
