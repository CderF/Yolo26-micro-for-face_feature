# YOLO26-Micro Custom Architecture for Facial Micro-Expression Detection
# Author: Yolo Master
# Goal: 抛弃 P5 ，引入 P2 (160x160) 超高分辨率，并融入 C2PSA 注意力机制

# 基础参数配置
nc: 7               # 类别数 (后续根据你的微表情数据集修改，例如 7 种情绪就改成 7)
scales:              # 模型缩放比例 [depth, width, max_channels]
  s: [0.33, 0.50, 1024] # 这里可以根据网课端侧设备的算力选择 n/s/m
end2end: True        # 开启端到端预测，干掉 NMS 后处理，降低推理延迟

# Backbone (骨干网络) - 截断于 P4，深挖 P2

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0: P1/2 (320x320) - 初始下采样

  # === P2 超清层提取 ===
  - [-1, 1, Conv, [256, 3, 2]]  # 1: P2/4 (160x160)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2: 提取高频细节
  # 将注意力机制死死钉在 P2，提前过滤海量的背景高频噪声！
  - [-1, 1, C2PSA, [256]]       # 3: C2PSA 注意力机制 (输出给 Neck 的 P2 纯净版)

  # === P3 主力层提取 ===
  - [-1, 1, Conv, [256, 3, 2]]  # 4: P3/8 (80x80)
  - [-1, 2, C3k2, [256, False, 0.25]] # 5: 提取小目标特征 (输出给 Neck 的 P3)

  # === P4 全局层提取 ===
  - [-1, 1, Conv, [512, 3, 2]]  # 6: P4/16 (40x40) - 这是我们新的网络的“尽头”
  - [-1, 2, C3k2, [512, True]]  # 7: 提取面部整体轮廓特征
  # 将 SPPF 移到 P4 层，让 40x40 的特征图拥有极大的全局感受野
  - [-1, 1, SPPF, [512, 5]]     # 8: 空间金字塔池化 (输出给 Neck 的 P4)

# Neck (颈部特征融合) - 重构成 P4 -> P3 -> P2 的多尺度立交桥

head:
  # === FPN: 自顶向下传导语义 ===
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9: 放大 P4 (40x40 -> 80x80)
  - [[-1, 5], 1, Concat, [1]]   # 10: 拼接 放大后的P4 和 原生P3
  - [-1, 2, C3k2, [256, False]] # 11: 融合消化 -> FPN_P3 (80x80)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12: 放大 FPN_P3 (80x80 -> 160x160)
  - [[-1, 3], 1, Concat, [1]]   # 13: 拼接 放大后的P3 和 经过C2PSA过滤的纯净P2
  - [-1, 2, C3k2, [128, False]] # 14: 融合消化 -> FPN_P2 (160x160) 🎯 Detect 1 输入

  # === PANet: 自底向上传导精准坐标 ===
  - [-1, 1, Conv, [128, 3, 2]]  # 15: 下采样 FPN_P2 (160x160 -> 80x80)
  - [[-1, 11], 1, Concat, [1]]  # 16: 拼接 新P2 和 FPN_P3
  - [-1, 2, C3k2, [256, False]] # 17: 融合消化 -> PAN_P3 (80x80) 🎯 Detect 2 输入

  - [-1, 1, Conv, [256, 3, 2]]  # 18: 下采样 PAN_P3 (80x80 -> 40x40)
  - [[-1, 8], 1, Concat, [1]]   # 19: 拼接 新P3 和 顶层SPPF输出的P4
  - [-1, 2, C3k2, [512, True]]  # 20: 融合消化 -> PAN_P4 (40x40) 🎯 Detect 3 输入

  # 3. Detect (检测头) - 定制化三焦段显微镜
  # 接收层级变为 [14, 17, 20]，分别对应重构后的 [P2(极微小), P3(小), P4(中)]
  - [[14, 17, 20], 1, Detect, [nc]] # 21: 端到端目标检测头